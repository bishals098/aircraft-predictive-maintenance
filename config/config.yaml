# Multi-dataset specific configurations
datasets:
  FD001:
    name: "Single Fault, Single Condition"
    fault_modes: 1
    operating_conditions: 1
    failure_threshold: 30
    complexity_weight: 1.0
  
  FD002:
    name: "Single Fault, Multiple Conditions"
    fault_modes: 1
    operating_conditions: 6
    failure_threshold: 25
    complexity_weight: 2.0
  
  FD003:
    name: "Multiple Faults, Single Condition"
    fault_modes: 2
    operating_conditions: 1
    failure_threshold: 30
    complexity_weight: 2.5
  
  FD004:
    name: "Multiple Faults, Multiple Conditions"
    fault_modes: 2
    operating_conditions: 6
    failure_threshold: 20
    complexity_weight: 4.0

# Sensor mappings for all datasets
sensors:
  - temperature
  - pressure
  - vibration
  - rpm
  - oil_level
  - fuel_flow
  - altitude
  - speed

# NASA C-MAPSS Healthy Sensor Baselines (for reference)
healthy_baselines:
  temperature: 518.67    # Fan inlet temperature (°R)
  pressure: 14.62        # Fan inlet pressure (psia)
  vibration: 0.3         # Low vibration = healthy
  rpm: 2388.04          # Physical fan speed (RPM)
  oil_level: 1.0        # Normal oil level
  fuel_flow: 553.90     # Normal fuel flow
  altitude: 0.0         # Sea level operation
  speed: 0.84           # Normal speed condition

# Data preprocessing
data:
  test_size: 0.2
  random_state: 42
  synthetic_samples: 10000

# Model configurations optimized for multi-dataset training
models:
  random_forest:
    n_estimators: 150
    max_depth: 12
    random_state: 42
    
  xgboost:
    n_estimators: 150
    max_depth: 8
    learning_rate: 0.1
    
  svm:
    kernel: 'rbf'
    C: 1.0
    gamma: 'scale'
    
  knn:
    n_neighbors: 5
    weights: 'uniform'
    
  lstm:
    units: 64
    dropout: 0.3
    epochs: 50
    batch_size: 64
    sequence_length: 30
    learning_rate: 0.001

alerts:
  # Normal/Low Risk: 0.0 - 0.35 (Healthy engines should be here)
  normal_threshold: 0.35
  
  # Warning/Medium Risk: 0.35 - 0.70 (Early degradation) 
  warning_threshold: 0.35
  
  # Critical/High Risk: 0.70+ (Imminent failure)
  failure_threshold: 0.70
  
  # Additional thresholds for granular control
  very_low_threshold: 0.20    # Excellent condition
  medium_threshold: 0.55      # Moderate concern
  high_threshold: 0.85        # Urgent attention needed

# Risk Level Classification Rules
risk_classification:
  excellent:
    min: 0.0
    max: 0.20
    label: "🟢 Excellent"
    action: "Continue normal operations"
    
  low:
    min: 0.20
    max: 0.35
    label: "🟢 Low Risk"
    action: "Continue routine monitoring"
    
  medium_low:
    min: 0.35
    max: 0.55
    label: "🟡 Medium-Low"
    action: "Enhanced monitoring recommended"
    
  medium:
    min: 0.55
    max: 0.70
    label: "🟡 Medium Risk"
    action: "Schedule inspection within 72 hours"
    
  high:
    min: 0.70
    max: 0.85
    label: "🔴 High Risk"
    action: "Schedule maintenance within 24 hours"
    
  critical:
    min: 0.85
    max: 1.0
    label: "🔴 Critical"
    action: "Ground aircraft immediately"

# Maintenance Recommendations by Risk Level
maintenance_recommendations:
  excellent: "Aircraft in optimal condition. Continue standard maintenance schedule."
  low: "Normal operation. Next routine inspection as scheduled."
  medium_low: "Consider enhanced monitoring. Review sensor trends."
  medium: "Schedule detailed inspection. Monitor closely."
  high: "Priority maintenance required. Investigate immediately."
  critical: "URGENT: Ground aircraft. Immediate inspection mandatory."

# Ensemble configurations
ensemble:
  cross_dataset_weight: 0.6
  individual_dataset_weight: 0.4
  voting_strategy: "soft"
  confidence_threshold: 0.75
  
# Feature Engineering Parameters
feature_engineering:
  rolling_windows: [3, 5, 10]
  lag_features: [1, 3, 5]
  statistical_features: ["mean", "std", "min", "max"]
  
# Visualization Settings
visualization:
  chart_theme: "plotly_white"
  color_scheme:
    excellent: "#00ff00"    # Bright green
    low: "#90EE90"          # Light green
    medium_low: "#FFD700"   # Gold
    medium: "#FFA500"       # Orange
    high: "#FF4500"         # Orange red
    critical: "#FF0000"     # Red
  
  radar_chart:
    fill_opacity: 0.3
    line_width: 2
    
# System Configuration
system:
  cache_enabled: true
  debug_mode: false
  log_level: "INFO"
  max_prediction_cache: 1000
  
# Performance Monitoring
performance:
  response_time_threshold: 2.0  # seconds
  accuracy_threshold: 0.85      # minimum acceptable accuracy
  memory_limit: "4GB"           # maximum memory usage